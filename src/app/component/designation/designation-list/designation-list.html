
<div class="page-container">

  <div class="page-header">

    <div>
      <h2>Designations</h2>
      <p>Manage employee designations.</p>
    </div>

    <a
      routerLink="/dashboard/designations/addesignations"
      class="add-btn">
      + Add Designation
    </a>

  </div>


  <!-- SUCCESS MESSAGE -->
  <div *ngIf="successMessage" class="success">
    {{ successMessage }}
  </div>


  <!-- ERROR MESSAGE -->
  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>


  <!-- LOADING -->
  <div *ngIf="loading" class="loading">
    Loading designations...
  </div>


  <!-- EMPTY -->
  <div
    *ngIf="!loading && designations.length === 0"
    class="empty">

    No designations found.

  </div>


  <!-- TABLE -->
  <div
    *ngIf="!loading && designations.length > 0"
    class="table-card">

    <table>

      <thead>
        <tr>
          <th>#</th>
          <th>Designation</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>


      <tbody>

        <tr
          *ngFor="let designation of designations; let i = index">

          <!-- NUMBER -->
          <td>
            {{ i + 1 }}
          </td>


          <!-- DESIGNATION -->
          <td>
            <strong>
              {{ designation.name }}
            </strong>
          </td>


          <!-- DESCRIPTION -->
          <td>
            {{ designation.description || '-' }}
          </td>


          <!-- ACTIONS -->
          <td>

            <div class="actions">

              <a
                [routerLink]="[
                  '/dashboard/designations/edit',
                  designation.id
                ]"
                class="edit-btn">

                Edit

              </a>


              <button
                type="button"
                class="delete-btn"
                (click)="deleteDesignation(designation.id)">

                Delete

              </button>

            </div>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
