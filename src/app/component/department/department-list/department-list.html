
<div class="page-container">

  <div class="page-header">

    <div>
      <h2>Departments</h2>
      <p>Manage organization departments.</p>
    </div>

    <a
      routerLink="/dashboard/departments/addepartments"
      class="add-btn">
      + Add Department
    </a>

  </div>


  <!-- SUCCESS MESSAGE -->
  <div *ngIf="successMessage" class="success">
    {{ successMessage }}
  </div>


  <!-- ERROR MESSAGE -->
  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>


  <!-- LOADING -->
  <div *ngIf="loading" class="loading">
    Loading departments...
  </div>


  <!-- EMPTY -->
  <div
    *ngIf="!loading && departments.length === 0"
    class="empty">

    No departments found.

  </div>


  <!-- TABLE -->
  <div
    *ngIf="!loading && departments.length > 0"
    class="table-card">

    <table>

      <thead>
        <tr>
          <th>#</th>
          <th>Department</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>


      <tbody>

        <tr
          *ngFor="let department of departments; let i = index">

          <!-- NUMBER -->
          <td>
            {{ i + 1 }}
          </td>


          <!-- DEPARTMENT -->
          <td>
            <strong>
              {{ department.name }}
            </strong>
          </td>


          <!-- DESCRIPTION -->
          <td>
            {{ department.description || '-' }}
          </td>


          <!-- ACTIONS -->
          <td>

            <div class="actions">

              <a
                [routerLink]="[
                  '/dashboard/departments/edit',
                  department.id
                ]"
                class="edit-btn">

                Edit

              </a>


              <button
                type="button"
                class="delete-btn"
                (click)="deleteDepartment(department.id)">

                Delete

              </button>

            </div>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
