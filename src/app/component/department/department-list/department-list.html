
<div class="page-container">

  <div class="page-header">

    <div>
      <h2>Departments</h2>
      <p>Manage organization departments.</p>
    </div>

    <a
      routerLink="/dashboard/departments/add"
      class="add-btn">
      + Add Department
    </a>

  </div>

  <div *ngIf="successMessage" class="success">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>

  <div *ngIf="loading" class="loading">
    Loading departments...
  </div>

  <div
    *ngIf="!loading && departments.length === 0"
    class="empty">
    No departments found.
  </div>

  <div
    *ngIf="!loading && departments.length > 0"
    class="table-card">

    <table>

      <thead>
        <tr>
          <th>#</th>
          <th>Department</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>

        <tr
          *ngFor="let department of departments; let i = index">

          <td>{{ i + 1 }}</td>

          <td>
            <strong>{{ department.name }}</strong>
          </td>

          <td>
            {{ department.description || '-' }}
          </td>

          <td>

            <div class="actions">

              <a
                [routerLink]="[
                  '/dashboard/departments/edit',
                  department.id
                ]"
                class="edit-btn">
                Edit
              </a>

              <button
                type="button"
                class="delete-btn"
                (click)="deleteDepartment(department.id)">
                Delete
              </button>

            </div>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
