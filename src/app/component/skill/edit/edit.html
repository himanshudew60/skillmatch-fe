
<div class="page-container">

  <div class="page-header">

    <div>
      <h2>Edit Skill</h2>
      <p>Create a new skill in the skill taxonomy.</p>
    </div>

    <a
      routerLink="/dashboard/skills"
      class="back-btn">
      Back
    </a>

  </div>

  <div class="form-card">

    <div class="form-group">

      <label for="name">
        Skill Name *
      </label>

      <input
        id="name"
        type="text"
        name="name"
        [(ngModel)]="skill.name"
        placeholder="Example: Python" />

    </div>

    <div class="form-group">

      <label for="category">
        Category *
      </label>

      <select
        id="category"
        name="category"
        [(ngModel)]="skill.category">

        <option
          *ngFor="let category of categories"
          [value]="category">

          {{ category }}

        </option>

      </select>

    </div>

    <div
      *ngIf="errorMessage"
      class="error">
      {{ errorMessage }}
    </div>

    <div class="form-actions">

      <a
        routerLink="/dashboard/skills"
        class="cancel-btn">
        Cancel
      </a>

      <button
  type="button"
  class="save-btn"
  [disabled]="saving"
  (click)="updateSkill()">
  {{ saving ? 'Updating...' : 'Update Skill' }}
</button>

    </div>

  </div>

</div>
