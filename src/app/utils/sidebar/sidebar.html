
<aside class="sidebar">

  <div class="logo-section">
    <div class="logo-icon">
      <span>AI</span>
    </div>

    <div class="logo-text">
      SkillMatch
      <span>AI</span>
    </div>
  </div>


  <!-- NAVIGATION -->
  <nav class="sidebar-nav">

    <!-- MAIN -->
    <div class="nav-section-title">
      MAIN
    </div>

    <!-- DASHBOARD -->
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
    >
      <!-- Dashboard / Home -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.5L12 3l9 7.5"></path>
        <path d="M5 9.5V21h14V9.5"></path>
        <path d="M9 21v-7h6v7"></path>
      </svg>

      <span>Dashboard</span>
    </a>


    <!-- PEOPLE -->
    <div class="nav-section-title">
      PEOPLE
    </div>

    <!-- EMPLOYEES -->
    <a
      *ngIf="loggedUser?.role_id === 1"
      routerLink="/dashboard/employees"
      routerLinkActive="active"
      class="nav-item"
    >
      <!-- Users / Employees -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="9" cy="8" r="3"></circle>
        <path d="M3 21c0-3.5 2.7-6 6-6s6 2.5 6 6"></path>
        <path d="M16 5.5a3 3 0 010 5.5"></path>
        <path d="M18 15c2 .8 3 2.8 3 6"></path>
      </svg>

      <span>Employees</span>

    <a

      routerLink="/dashboard/users"
      routerLinkActive="active"

        <path d="M5 21c.5-4 3.1-6 7-6s6.5 2 7 6"></path>
        <path d="M19 5v4"></path>
        <path d="M17 7h4"></path>
      </svg>

      <span>Users</span>
    </a>


    <!-- MASTER DATA -->
    <div class="nav-section-title">
      MASTER DATA
    </div>

    <!-- SKILLS -->
    <a
      *ngIf="loggedUser?.role_id === 1"
      routerLink="/dashboard/skills"
      routerLinkActive="active"
      class="nav-item"

      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.5 4a3.5 3.5 0 00-3.3 4.7A3.5 3.5 0 004 12a3.5 3.5 0 003 3.4A3.5 3.5 0 0010.5 19"></path>

        <path d="M14 9h3"></path>
        <path d="M7 15h3"></path>
        <path d="M14 15h3"></path>
      </svg>

    </a>

    <a
      *ngIf="loggedUser?.role_id === 1"
      routerLink="/dashboard/departments"
      routerLinkActive="active"
      class="nav-item"
    >
      <!-- Building / Department -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 21V5l8-3 8 3v16"></path>
        <path d="M2 21h20"></path>
        <path d="M8 7h2"></path>
        <path d="M14 7h2"></path>

        <path d="M14 15h2"></path>
        <path d="M10 21v-3h4v3"></path>

      routerLinkActive="active"
      class="nav-item"

      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="4" width="16" height="16" rx="2"></rect>
        <circle cx="12" cy="9" r="2.5"></circle>
        <path d="M8 16c.8-2 2.1-3 4-3s3.2 1 4 3"></path>
      </svg>

      <span>Designations</span>
    </a>

    </a>

    <a
      routerLink="/dashboard/requirements"
      routerLinkActive="active"
      class="nav-item"
    >
      <!-- Clipboard / Requirements -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="5" y="4" width="14" height="17" rx="2"></rect>
        <path d="M9 4V3h6v1"></path>
        <path d="M8 9h8"></path>
        <path d="M8 13h8"></path>
        <path d="M8 17h5"></path>
      </svg>

      <span>Project Requirements</span>
    </a>


    <!-- FUTURE -->
    <div class="nav-section-title">
      MANAGEMENT
    </div>

    <!-- RESOURCE ALLOCATION -->
    <a
      routerLink="/dashboard/allocation"
      routerLinkActive="active"
      class="nav-item"
    >
      <!-- Users / Allocation -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="8" cy="8" r="3"></circle>
        <circle cx="17" cy="8" r="3"></circle>
        <path d="M2.5 20c.4-3.5 2.3-5.5 5.5-5.5s5.1 2 5.5 5.5"></path>
        <path d="M13 15c1-.5 2-.7 3.5-.7 3.2 0 5.1 2 5.5 5.7"></path>
      </svg>

      <span>Resource Allocation</span>
    </a>


    <!-- REPORTS -->
    <a
      routerLink="/dashboard/reports"
      routerLinkActive="active"
      class="nav-item"
    >
      <!-- Bar Chart / Reports -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 19V5"></path>
        <path d="M4 19h17"></path>
        <rect x="8" y="11" width="2.5" height="6" rx=".5"></rect>

  <!-- SIDEBAR FOOTER -->
  <div class="sidebar-footer">
    <div class="footer-status">
      <span class="status-dot"></span>
      <span>AI Matching System</span>
